name: Unit Tests

on:
  workflow_call:
    inputs:
      tsVersion:
        required: true
        type: string
      experimental:
        # When true, a failing job does not fail the calling workflow. Used for
        # TypeScript versions the toolchain cannot run yet (see P456860642).
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit_test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    # GitHub does not allow `continue-on-error` on the job that calls a reusable
    # workflow, so the opt-out lives here and is driven by the input above.
    continue-on-error: ${{ inputs.experimental }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: amplify-data
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
      - name: Enable Corepack for Yarn 4
        run: corepack enable
      - name: Install specific typescript version
        env:
          VERSION: ${{ inputs.tsVersion }}
        working-directory: ./amplify-data
        run: yarn add typescript@$VERSION
      - name: Setup node and build the repository
        uses: ./amplify-data/.github/actions/node-and-build
        with:
          force: true
      - name: Report installed TypeScript version
        working-directory: ./amplify-data
        run: yarn tsc --version
      - name: Run tests
        working-directory: ./amplify-data
        # Newer TypeScript compilers use more memory type-checking this repo's
        # generic-heavy types via ts-jest, exceeding V8's default (~4GB) heap.
        # Raise the limit so the canary reports real regressions, not OOMs.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: yarn lint && yarn test
