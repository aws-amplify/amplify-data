name: Publish package and create release on github

on:
  workflow_call:
    inputs:
      preid:
        required: false
        type: string
      allow-protected-preid:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    name: Publish to Amplify Package
    runs-on: ubuntu-latest
    # Job-level permissions replace workflow-level ones; id-token is required for npm trusted publishing (OIDC)
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Forbidden and protected preid protection
        # Protection for registry tags that we want to protect from accidental use
        env:
          ALLOW_PROTECTED_PREIDS: ${{ inputs.allow-protected-preid }}
          PREID: ${{ inputs.preid }}
          FORBIDDEN_PREIDS: latest
          PROTECTED_PREIDS: next unstable
        run: |
          if [[ -z "$PREID" ]]; then echo "preid is empty; refusing to publish (an empty preid would fall back to the 'latest' tag)"; exit 1; fi
          echo "Testing to see if $PREID is in the forbidden list ($FORBIDDEN_PREIDS)"
          # Compare case-insensitively; the forbidden/protected lists are lowercase
          PREID_LOWER=$(echo "$PREID" | tr '[:upper:]' '[:lower:]')
          for e in $FORBIDDEN_PREIDS; do [[ $PREID_LOWER == $e ]] && echo "$PREID is forbidden from preid release" && exit 1; done
          [[ $ALLOW_PROTECTED_PREIDS == 'false' ]] && echo "Testing to see if $PREID is in the protected list ($PROTECTED_PREIDS)"
          [[ $ALLOW_PROTECTED_PREIDS == 'false' ]] && for e in $PROTECTED_PREIDS; do [[ $PREID_LOWER == $e ]] && echo "$PREID is protected from preid release" && exit 1; done
          echo "$PREID is allowed for preid release"

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: amplify-data
          token: ${{ secrets.GH_TOKEN_AMPLIFY_WRITE }}

      # npm trusted publishing requires npm >= 11.5.1, provided by the Node version pinned in node-and-build.
      - name: Setup node and build the repository
        uses: ./amplify-data/.github/actions/node-and-build

      - name: Run publish
        uses: ./amplify-data/.github/actions/publish
        with:
          target: preid
          preid: ${{ inputs.preid }}
          github_user: ${{ vars.GH_USER}}
          github_email: ${{ vars.GH_EMAIL}}
