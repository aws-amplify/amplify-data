name: Typescript Canary

on:
  # Tests scheduled at 6pm(UTC) / 11am(PDT) everyday
  # default supported timezone is UTC
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

# TypeScript 7 (`latest`, `rc`, `next` since 2026-06) is the native Go compiler.
# Its npm package no longer exposes the JS compiler API that ts-jest and
# typescript-eslint need, so those jobs cannot pass until the toolchain
# supports TS 7. They stay visible but non-blocking (`experimental: true`).
# TypeScript 6 is the last JS-based release line and is the blocking canary.
# Ticket: P456860642
jobs:
  ts6-canary:
    secrets: inherit
    uses: ./.github/workflows/callable-ts-version-unit-test.yml
    with:
      tsVersion: '6'
  rc-canary:
    secrets: inherit
    uses: ./.github/workflows/callable-ts-version-unit-test.yml
    with:
      tsVersion: 'rc'
      experimental: true
  next-canary:
    secrets: inherit
    uses: ./.github/workflows/callable-ts-version-unit-test.yml
    with:
      tsVersion: 'next'
      experimental: true
  latest-canary:
    secrets: inherit
    uses: ./.github/workflows/callable-ts-version-unit-test.yml
    with:
      tsVersion: 'latest'
      experimental: true
