name: Release

# Single entry point for all npm publishes.
#
# npm trusted publishing (OIDC) validates the filename of the top-level (caller) workflow, not the
# reusable workflow that runs the publish. Keeping every publish in this one file means each package
# needs just one trusted-publisher entry (release.yml) and the release paths share one concurrency
# group. It switches on the pushed branch to the release (main) and preid (feat/**/main) paths.

# Restrict the default GITHUB_TOKEN to least privilege. Called workflows can only use the
# permissions granted here.
# The publish jobs push via a dedicated PAT (GH_TOKEN_AMPLIFY_WRITE) and publish to npm via
# trusted publishing (OIDC; id-token: write on the release / preid-release jobs), and the
# sandbox_test job sets its own id-token: write for AWS OIDC below.
permissions:
  contents: read

concurrency:
  # group name unique per pushed ref (shared by the main and preid release paths).
  # Cancel superseded runs on feature/preid branches, but never on main: a job-level
  # concurrency group does not shield a job from a workflow-level cancellation (only an
  # `if:` survives it), so cancelling a main run could interrupt the release job between
  # `npm publish` and the tag push. A newer main run queues behind the in-progress one instead.
  group: push-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

on:
  push:
    branches:
      # NOTE: to run E2E tests against an `amplify-data` branch, add the name
      # of that branch (and corresponding `amplify-js-samples-staging` branch, if
      # testing sample / test changes) here.
      # Must disable publishing prior to adding this branch to avoid
      # accidentally publishing changes.
      - main
      # Branch naming pattern: feat/{PREID}/main
      - feat/**/main

jobs:
  # ---- release from main to latest (github.ref_name == 'main') ----
  prebuild-ubuntu:
    if: github.ref_name == 'main'
    uses: ./.github/workflows/callable-prebuild-amplify-data.yml
    with:
      runs_on: ubuntu-latest
  # This step is included at the top level as a workround (i.e. not in a
  # nested workflow). See: https://github.com/orgs/community/discussions/76409.
  # The `configure-aws-credentials` GH Action is unable to retrieve the JWT
  # token when run from a nested workflow.
  # TODO: Find a workaround or alternative so that this can be included in a
  # nested workflow (e.g. `callable-sandbox-e2e-tests.yml`).
  sandbox_test:
    if: github.ref_name == 'main'
    name: Sandbox E2E Tests
    needs: prebuild-ubuntu
    runs-on: ubuntu-latest
    permissions:
      # these permissions are required for the `configure-aws-credentials` action to get a JWT:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: amplify-data
      - name: Setup node and build the repository
        uses: ./amplify-data/.github/actions/node-and-build
      - name: Configure AWS test execution credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ secrets.SANDBOX_E2E_RUNNER_ROLE_ARN }}
          aws-region: us-west-2
      - name: Install Sandbox E2E Dependencies
        working-directory: ./amplify-data
        run: yarn e2e-sandbox:install
      - name: Run E2E sandbox tests
        working-directory: ./amplify-data
        run: yarn e2e-sandbox:test
  # Runs on both the main and feat/**/main paths; both publish jobs depend on it.
  release-verification-testing:
    secrets: inherit
    uses: ./.github/workflows/callable-release-verification.yml
  release:
    if: github.ref_name == 'main'
    needs:
      - release-verification-testing
      - sandbox_test
    # id-token is required by the called publish workflow for npm trusted publishing (OIDC)
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    uses: ./.github/workflows/callable-publish-release.yml

  # ---- release for feature preid (feat/**/main) ----
  prebuild-preid:
    if: startsWith(github.ref_name, 'feat/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: amplify-data
      - name: Setup node and build the repository
        uses: ./amplify-data/.github/actions/node-and-build
        with:
          is-prebuild: true
  unit-tests:
    if: startsWith(github.ref_name, 'feat/')
    needs:
      - prebuild-preid
    uses: ./.github/workflows/callable-unit-tests.yml
  parse-preid:
    if: startsWith(github.ref_name, 'feat/')
    name: Parse preid from branch
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - id: output_preid
        run: echo "preid=$(echo $BRANCH |  tr -cd '[:alnum:]_\-/.' | cut -d \/ -f 2)" >> $GITHUB_OUTPUT
    outputs:
      preid: ${{ steps.output_preid.outputs.preid }}
  preid-release:
    if: startsWith(github.ref_name, 'feat/')
    needs:
      - release-verification-testing
      - unit-tests
      - parse-preid
    # id-token is required by the called publish workflow for npm trusted publishing (OIDC)
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    uses: ./.github/workflows/callable-publish-preid.yml
    # The preid should be detected from the branch name recommending feat/{PREID}/whatever as branch naming pattern
    #   if your branch doesn't follow this pattern, you can override it here for your branch.
    with:
      preid: ${{ needs.parse-preid.outputs.preid }}
